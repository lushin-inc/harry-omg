<style>
:root{
  --bg:#F7F7F2;
  --surface:#FFFFFF;
  --line:#E7E5DF;
  --ink:#321432;
  --ink-2:#6B5A6B;
  --ink-3:#9E909E;
  --hover:#EFEEE8;
  --link:#008CFF;
  --shadow:0 1px 2px rgba(50,20,50,.05), 0 10px 28px -18px rgba(50,20,50,.4);
  --from:#008CFF;
  --to:#0057A8;
  --grad:linear-gradient(150deg,var(--from) 0%,var(--to) 100%);
}
html[data-theme="dark"]{
  --bg:#1A0A1A;
  --surface:#261026;
  --line:#3C213C;
  --ink:#F7F7F2;
  --ink-2:#C4B0C4;
  --ink-3:#8F7C8F;
  --hover:#301630;
  --link:#5AB8FF;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.75);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  min-height:100vh;
  background:var(--bg);color:var(--ink);
  font-family:Poppins,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}

.wrap{width:100%;max-width:min(1120px,94vw);margin:0 auto;padding:26px 40px 56px;}

/* ---- header ---- */
.pagehead{display:flex;align-items:center;gap:18px;margin:0 0 26px;}
.lu img{height:27px;width:auto;display:block;}
.lu .dk{display:none;}
html[data-theme="dark"] .lu .lt{display:none;}
html[data-theme="dark"] .lu .dk{display:block;}
.iconbtn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .12s ease,color .12s ease;
}
.iconbtn:hover{background:var(--hover);color:var(--ink);}
.iconbtn svg{width:18px;height:18px;display:block;}

/* ---- banner ---- */
.banner{
  border-radius:24px;padding:38px 34px;margin:0 0 22px;
  background:var(--grad);color:#fff;
  box-shadow:0 18px 40px -24px rgba(0,140,255,.7);
}
.banner h1{font-size:38px;font-weight:600;letter-spacing:-.026em;line-height:1.08;margin:0;}

/* ---- candidate buttons (OMG registration pages) ---- */
.rowlabel{font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin:30px 0 12px;}
.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:0 0 26px;}
.role{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  border-radius:16px;padding:22px 26px;
  background:var(--grad);color:#fff;
  font-size:19px;font-weight:600;letter-spacing:-.012em;
  box-shadow:0 14px 32px -18px rgba(0,140,255,.7);
  transition:transform .14s ease,filter .14s ease;
}
.role:hover{transform:translateY(-3px);filter:brightness(1.06);}
.role svg{width:19px;height:19px;flex:0 0 19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.8;}

/* ---- email template panel ---- */
.panel{
  background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:30px 34px;box-shadow:var(--shadow);
}
.langrow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:26px;}
.langbtn{
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:13px;padding:15px 12px;font-size:16px;font-weight:500;
  cursor:pointer;transition:all .13s ease;
}
.langbtn:hover{background:var(--hover);color:var(--ink);}
.langbtn.on{background:var(--grad);color:#fff;border-color:transparent;font-weight:600;}

.doc{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:28px 30px;}
.doc .body{font-size:15.5px;line-height:1.68;color:var(--ink-2);outline:none;}
.doc .body p{margin:0 0 15px;}
.doc .body p.tight{margin:0 0 4px;}
.doc .body b{font-weight:600;color:var(--ink);}
.doc .body ul{margin:6px 0 15px;padding-left:22px;}
.doc .body li{margin-bottom:5px;}
.doc .body a{color:var(--link);word-break:break-all;}
.token{
  background:rgba(230,40,75,.13);color:#E6284B;
  border-radius:4px;padding:1px 5px;font-weight:500;
}
.edithint{font-size:14px;color:var(--ink-3);margin:14px 0 0;}

.actions{display:flex;flex-direction:column;gap:12px;margin-top:26px;}
.btn{
  display:block;width:100%;font-family:inherit;font-size:17px;font-weight:500;
  padding:19px 24px;border:none;border-radius:999px;cursor:pointer;
  transition:transform .12s,filter .18s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 12px 28px -14px rgba(0,140,255,.8);}
.btn-primary:hover{filter:brightness(1.07);}
.btn-outline{color:var(--ink);background:var(--surface);border:1.5px solid var(--line);}
.btn-outline:hover{background:var(--hover);}

@media (max-width:820px){
  body{font-size:16.5px;}
  .wrap{padding:20px 16px 40px;max-width:100%;}
  .banner{padding:28px 22px;border-radius:18px;}
  .banner h1{font-size:29px;}
  .roles{grid-template-columns:1fr;gap:11px;}
  .role{padding:19px 22px;font-size:17.5px;}
  .panel{padding:22px 18px;border-radius:16px;}
  .langrow{gap:10px;}
  .langbtn{padding:13px 8px;font-size:15px;}
  .doc{padding:20px 18px;}
  .lu img{height:24px;}
}
@media print{
  .pagehead,.roles,.langrow,.edithint,.actions{display:none!important;}
  .banner,.panel{box-shadow:none;}
}

.title{font-size:34px;font-weight:600;letter-spacing:-.026em;line-height:1.1;margin:8px 0 18px;color:var(--ink);}
.title-email{margin-top:46px;}
.seg{display:inline-grid;grid-template-columns:repeat(2,auto);gap:4px;background:var(--hover);padding:5px;border-radius:14px;}
.seg .langbtn{border:none;background:transparent;padding:11px 26px;font-size:15.5px;}
.seg .langbtn.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(50,20,50,.16);}
html[data-theme="dark"] .seg .langbtn.on{background:#3C213C;}
.ext svg{width:17px;height:17px;flex:0 0 17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

.rowlabel{font-size:15px;font-weight:600;color:var(--ink-2);margin:0 0 10px;}
.role{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none;font-weight:500;font-size:18px;}
.role svg{opacity:1;color:var(--from);}
.role:hover{transform:none;filter:none;border-color:var(--from);}
.panel .seg{margin-bottom:22px;}
@media (max-width:820px){.title{font-size:28px;margin-bottom:14px}.title-email{margin-top:36px}.seg{display:grid;grid-template-columns:1fr 1fr}}
</style>
</head>

/* ==========================================================================

var STORE = "harryOmgEmailV1";
var THEME = "harry-omg-theme";
var ARROW = '<svg viewBox="0 0 24 24"><path d="M7 17L17 7M8.5 7H17v8.5"/></svg>';

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
var CUR = ROLES[0].key;
function cur(){
  for(var i=0;i<ROLES.length;i++) if(ROLES[i].key === CUR) return ROLES[i];

}
function save(){ try{ localStorage.setItem(STORE, CUR); }catch(e){} }
function load(){
  try{
    var k = localStorage.getItem(STORE);

  }catch(e){}

  }).join("");
}

    out += esc(rest.slice(0, m.index));
    var e = map[m[1]] || {};
    out += e.html ? e.html : esc(e.text || "");
    rest = rest.slice(m.index + m[0].length);
  }
  return out + esc(rest);
}
/* a red placeholder — it turns black as soon as it is edited */
function emTok(t){ return '<span class="token" data-ph="' + esc(t) + '">' + esc(t) + '</span>'; }

function paintTabs(){
  var box = document.getElementById("em-langs");
  box.innerHTML = ROLES.map(function(r){

           esc(r.label) + '</button>';

  Array.prototype.forEach.call(box.querySelectorAll("[data-opt]"), function(b){

/* plain text, read back off the edited page */
function docText(id){
  var el = document.getElementById(id);
  if(!el) return "";
  var out = [];
  Array.prototype.forEach.call(el.childNodes, function(n){
    if(n.nodeType !== 1) return;
    if(n.tagName === "UL"){
      Array.prototype.forEach.call(n.children, function(li){
        out.push("• " + li.textContent.trim());
      });
      out.push("");
      return;
    }
    out.push(n.textContent.trim());
    if(String(n.className).indexOf("tight") === -1) out.push("");
  });
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

/* ==========================================================================
   COPY
   ========================================================================== */
function copyText(text, btn, doneLabel, restoreLabel){
  var prevBg = btn.style.background;
  function ok(){
    btn.textContent = doneLabel;
    btn.classList.add("done");
    if(!prevBg) btn.style.background = btn.style.getPropertyValue("--on") || "#321432";
    setTimeout(function(){
      btn.textContent = restoreLabel;
      btn.classList.remove("done");
      btn.style.background = prevBg;
    }, 1600);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, function(){ fallbackCopy(text, ok); });
  } else { fallbackCopy(text, ok); }
}
function fallbackCopy(text, ok){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); ok(); }catch(e){}
  document.body.removeChild(ta);
}


/* ==========================================================================
   Word (.docx) builder — no libraries, builds a real zip
   ========================================================================== */
var CRC_TABLE=(function(){var t=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CRC_TABLE[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function sb(s){var o=[],i,cp;for(i=0;i<s.length;i++){cp=s.charCodeAt(i);
  if(cp<0x80)o.push(cp);
  else if(cp<0x800){o.push(0xC0|(cp>>6),0x80|(cp&63));}
  else if(cp>=0xD800&&cp<=0xDBFF){var lo=s.charCodeAt(++i);var u=0x10000+((cp-0xD800)<<10)+(lo-0xDC00);o.push(0xF0|(u>>18),0x80|((u>>12)&63),0x80|((u>>6)&63),0x80|(u&63));}
  else{o.push(0xE0|(cp>>12),0x80|((cp>>6)&63),0x80|(cp&63));}}
  return new Uint8Array(o);}
function zipFiles(files){
  var chunks=[],central=[],offset=0;
  function u16(n){return [n&255,(n>>8)&255];}
  function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];}
  files.forEach(function(f){
    var name=sb(f.name),data=sb(f.data),c=crc32(data);
    var lh=[].concat([80,75,3,4],u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(data.length),u32(data.length),u16(name.length),u16(0));
    chunks.push(new Uint8Array(lh),name,data);
    central.push([].concat([80,75,1,2],u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset)),name);
    offset+=lh.length+name.length+data.length;
  });
  var cd=[],cdStart=offset,cdLen=0;
  for(var i=0;i<central.length;i+=2){cd.push(new Uint8Array(central[i]),central[i+1]);}
  cd.forEach(function(b){cdLen+=b.length;});
  var eocd=new Uint8Array([].concat([80,75,5,6],u16(0),u16(0),u16(files.length),u16(files.length),u32(cdLen),u32(cdStart),u16(0)));
  var all=chunks.concat(cd,[eocd]),total=0;
  all.forEach(function(b){total+=b.length;});
  var out=new Uint8Array(total),p=0;
  all.forEach(function(b){out.set(b,p);p+=b.length;});
  return out;
}
function xe(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;");}
function wr(t,b){return '<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="22"/>'+(b?'<w:b/>':'')+'</w:rPr><w:t xml:space="preserve">'+xe(t)+'</w:t></w:r>';}
function wp(r,bullet){
  return '<w:p><w:pPr>'+(bullet?'<w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr>':'')+'<w:spacing w:after="0" w:line="259" w:lineRule="auto"/></w:pPr>'+r+'</w:p>';
}
function wblank(){return wp("");}

var DOCX_LINK = "";
function wlink(t){
  return '<w:hyperlink r:id="rIdLink"><w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/>'
       + '<w:sz w:val="22"/><w:color w:val="0563C1"/><w:u w:val="single"/></w:rPr>'
       + '<w:t xml:space="preserve">' + xe(t) + '</w:t></w:r></w:hyperlink>';
}
function runsFrom(node){
  var s = "";
  Array.prototype.forEach.call(node.childNodes, function(c){
    if(c.nodeType === 3){ s += wr(c.nodeValue); return; }
    if(c.nodeType !== 1) return;
    if(c.tagName === "BR") return;
    if(c.tagName === "A"){ s += wlink(c.textContent); return; }
    if(c.tagName === "B" || c.tagName === "STRONG"){ s += wr(c.textContent, true); return; }
    s += runsFrom(c);
  });
  return s;
}
function buildDocx(id){
  /* built from what is on screen, so the reader's edits come through */
  var el = document.getElementById(id || "em-out");
  var a  = el ? el.querySelector("a[href]") : null;
  var isUrl = !!(a && /^https?:\/\//i.test(a.getAttribute("href") || ""));
  DOCX_LINK = isUrl ? a.getAttribute("href") : "";
  var b = "";
  if(el) Array.prototype.forEach.call(el.childNodes, function(n){
    if(n.nodeType !== 1) return;
    if(n.tagName === "UL"){
      Array.prototype.forEach.call(n.children, function(li){ b += wp(runsFrom(li), true); });
      return;
    }
    b += wp(runsFrom(n));
    if(String(n.className).indexOf("tight") === -1) b += wblank();
  });

  var doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>'
    + b + '<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>';

  var ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
    + '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>'
    + '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>';

  var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';

  var drels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>'
    + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
    + (isUrl ? '<Relationship Id="rIdLink" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="' + xe(DOCX_LINK) + '" TargetMode="External"/>' : "")
    + '</Relationships>';

  var numbering = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    + '<w:abstractNum w:abstractNumId="0"><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="&#8226;"/>'
    + '<w:lvlJc w:val="left"/><w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr>'
    + '<w:rPr><w:rFonts w:ascii="Symbol" w:hAnsi="Symbol" w:hint="default"/></w:rPr></w:lvl></w:abstractNum>'
    + '<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num></w:numbering>';

  var styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    + '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="22"/></w:rPr></w:rPrDefault></w:docDefaults>'
    + '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>';

  return zipFiles([
    {name:"[Content_Types].xml",     data:ct},
    {name:"_rels/.rels",             data:rels},
    {name:"word/document.xml",       data:doc},
    {name:"word/_rels/document.xml.rels", data:drels},
    {name:"word/numbering.xml",      data:numbering},
    {name:"word/styles.xml",         data:styles}
  ]);
}

function downloadDocx(id){
  var bytes = buildDocx(id);
  var blob  = new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  var a     = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Hubexo Email Template - " + cur().label + ".docx";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 400);
}

/* ==========================================================================

   ========================================================================== */
var SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M18.6 5.4l-1.5 1.5M6.9 17.1l-1.5 1.5"/></svg>';
var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5a8.6 8.6 0 1 0 10.8 10.8z"/></svg>';
function paintTheme(){
  document.getElementById("theme").innerHTML =
    document.documentElement.getAttribute("data-theme") === "dark" ? SUN : MOON;
}
try{
  if(localStorage.getItem(THEME) === "dark")
    document.documentElement.setAttribute("data-theme","dark");
}catch(e){}
document.getElementById("theme").addEventListener("click", function(){
  var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(THEME, next); }catch(e){}
  paintTheme();
});
